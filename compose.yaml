services:
  api:
    build: .
    ports:
      - "127.0.0.1:${PORT:-8000}:8000"
    environment:
      APP_ENV: production
      DATABASE_PATH: /app/data/concierge.db
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: json
      API_KEY_HASHES: ${API_KEY_HASHES:?API_KEY_HASHES must be set}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
      METRICS_ENABLED: "true"
      DOCS_ENABLED: "false"
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:14b}
    volumes:
      - concierge-data:/app/data
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    init: true
    cpus: 1.0
    mem_limit: 512m
    stop_grace_period: 20s
    restart: unless-stopped

volumes:
  concierge-data:
