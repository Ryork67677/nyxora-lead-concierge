[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "nyxora-lead-concierge"
version = "0.3.0"
description = "A privacy-conscious lead qualification and human-handoff API."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Russell York" }]
dependencies = [
  "fastapi>=0.115,<1.0",
  "prometheus-client>=0.23,<1.0",
  "uvicorn[standard]>=0.34,<1.0",
]

[project.optional-dependencies]
dev = [
  "httpx2>=2.0,<3.0",
  "pip-audit>=2.9,<3.0",
  "pytest>=9.0.3,<10.0",
  "pytest-cov>=6.0,<7.0",
  "ruff>=0.11,<1.0",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nyxora_concierge = ["data/*.json"]

[tool.pytest.ini_options]
addopts = "-q --cov=nyxora_concierge --cov-report=term-missing --cov-fail-under=85"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
